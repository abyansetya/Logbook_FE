services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://127.0.0.1:8000/api/v1
    command: sh -c "npm ci && npm run dev" -- --host 0.0.00"

volumes:
  frontend_node_modules:
